# The links in the header of the website, in order.
#
# Removing a link here takes it out of the header, but the page itself is still
# built. To stop a page being built at all, add `published: false` to the top of
# its file in _pages/.

main:
  - title: "Publications"
    url: /publications/

  - title: "Research"
    url: /research/

  # Hidden automatically until _posts has at least one post
  # (see _includes/masthead.html).
  - title: "Writing"
    url: /writing/

  - title: "CV"
    url: /cv/

  # Not in use yet. To turn one on, uncomment it here and delete the
  # `published: false` line at the top of the matching file in _pages/.
