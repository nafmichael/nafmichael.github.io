<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Images and text mapped into one shared embedding space">
  <rect width="800" height="500" fill="#eef1f5"/>
  <!-- image input -->
  <rect x="60" y="95" width="170" height="130" rx="10" fill="#fff" stroke="#1f3a5f" stroke-width="4"/>
  <polygon points="75,210 125,145 165,190 190,165 215,210" fill="#2a9d8f"/>
  <circle cx="190" cy="130" r="14" fill="#e9b949"/>
  <!-- text input -->
  <rect x="60" y="280" width="170" height="130" rx="10" fill="#fff" stroke="#1f3a5f" stroke-width="4"/>
  <rect x="80" y="305" width="130" height="12" rx="6" fill="#1f3a5f"/>
  <rect x="80" y="330" width="105" height="12" rx="6" fill="#8aa0b8"/>
  <rect x="80" y="355" width="120" height="12" rx="6" fill="#8aa0b8"/>
  <rect x="80" y="380" width="80" height="12" rx="6" fill="#8aa0b8"/>
  <!-- arrows -->
  <path d="M245 160 C 330 160, 360 230, 430 240" fill="none" stroke="#1f3a5f" stroke-width="5"/>
  <path d="M245 345 C 330 345, 360 270, 430 262" fill="none" stroke="#1f3a5f" stroke-width="5"/>
  <polygon points="430,228 452,242 432,256" fill="#1f3a5f"/>
  <polygon points="430,250 452,262 432,276" fill="#1f3a5f"/>
  <!-- shared embedding space -->
  <circle cx="610" cy="250" r="165" fill="#fff" stroke="#1f3a5f" stroke-width="4"/>
  <g stroke="#8aa0b8" stroke-width="3">
    <line x1="545" y1="170" x2="575" y2="190"/>
    <line x1="660" y1="175" x2="690" y2="200"/>
    <line x1="530" y1="290" x2="560" y2="315"/>
    <line x1="640" y1="300" x2="672" y2="318"/>
    <line x1="600" y1="240" x2="628" y2="258"/>
  </g>
  <g fill="#2a9d8f">
    <circle cx="545" cy="170" r="11"/><circle cx="660" cy="175" r="11"/><circle cx="530" cy="290" r="11"/><circle cx="640" cy="300" r="11"/><circle cx="600" cy="240" r="11"/>
  </g>
  <g fill="#1f3a5f">
    <rect x="565" y="180" width="20" height="20" rx="3"/><rect x="680" y="190" width="20" height="20" rx="3"/><rect x="550" y="305" width="20" height="20" rx="3"/><rect x="662" y="308" width="20" height="20" rx="3"/><rect x="618" y="248" width="20" height="20" rx="3"/>
  </g>
</svg>
