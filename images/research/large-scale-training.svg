<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Many GPU workers connected to a coordinating cluster head">
  <rect width="800" height="500" fill="#eef1f5"/>
  <!-- links -->
  <g stroke="#8aa0b8" stroke-width="4">
    <line x1="400" y1="110" x2="160" y2="250"/><line x1="400" y1="110" x2="320" y2="250"/><line x1="400" y1="110" x2="480" y2="250"/><line x1="400" y1="110" x2="640" y2="250"/>
  </g>
  <!-- head node -->
  <rect x="320" y="55" width="160" height="80" rx="12" fill="#1f3a5f"/>
  <circle cx="365" cy="95" r="12" fill="#e9b949"/><rect x="390" y="85" width="65" height="10" rx="5" fill="#fff"/><rect x="390" y="102" width="45" height="8" rx="4" fill="#8aa0b8"/>
  <!-- worker nodes, each with two GPUs -->
  <g>
    <rect x="95" y="230" width="130" height="190" rx="12" fill="#fff" stroke="#1f3a5f" stroke-width="4"/>
    <rect x="255" y="230" width="130" height="190" rx="12" fill="#fff" stroke="#1f3a5f" stroke-width="4"/>
    <rect x="415" y="230" width="130" height="190" rx="12" fill="#fff" stroke="#1f3a5f" stroke-width="4"/>
    <rect x="575" y="230" width="130" height="190" rx="12" fill="#fff" stroke="#1f3a5f" stroke-width="4"/>
  </g>
  <g fill="#2a9d8f">
    <rect x="115" y="255" width="90" height="65" rx="6"/><rect x="115" y="335" width="90" height="65" rx="6"/>
    <rect x="275" y="255" width="90" height="65" rx="6"/><rect x="275" y="335" width="90" height="65" rx="6"/>
    <rect x="435" y="255" width="90" height="65" rx="6"/><rect x="435" y="335" width="90" height="65" rx="6"/>
    <rect x="595" y="255" width="90" height="65" rx="6"/><rect x="595" y="335" width="90" height="65" rx="6"/>
  </g>
  <g fill="#1f3a5f" opacity="0.35">
    <rect x="130" y="270" width="60" height="35" rx="3"/><rect x="130" y="350" width="60" height="35" rx="3"/>
    <rect x="290" y="270" width="60" height="35" rx="3"/><rect x="290" y="350" width="60" height="35" rx="3"/>
    <rect x="450" y="270" width="60" height="35" rx="3"/><rect x="450" y="350" width="60" height="35" rx="3"/>
    <rect x="610" y="270" width="60" height="35" rx="3"/><rect x="610" y="350" width="60" height="35" rx="3"/>
  </g>
  <!-- gradient sync arrows -->
  <g stroke="#e9b949" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M230 455 H 570"/><path d="M555 445 L570 455 L555 465"/><path d="M245 445 L230 455 L245 465"/>
  </g>
</svg>
