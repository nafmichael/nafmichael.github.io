<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="An agent proposes a change, a tool runs it, and the result is checked">
  <rect width="800" height="500" fill="#eef1f5"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1f3a5f"/></marker></defs>
  <!-- agent -->
  <circle cx="200" cy="250" r="95" fill="#1f3a5f"/>
  <rect x="150" y="215" width="100" height="70" rx="16" fill="#fff"/>
  <circle cx="178" cy="245" r="10" fill="#1f3a5f"/><circle cx="222" cy="245" r="10" fill="#1f3a5f"/>
  <rect x="180" y="265" width="40" height="7" rx="3.5" fill="#2a9d8f"/>
  <line x1="200" y1="215" x2="200" y2="195" stroke="#fff" stroke-width="5"/><circle cx="200" cy="190" r="8" fill="#e9b949"/>
  <!-- tool: chip layout -->
  <rect x="470" y="70" width="190" height="150" rx="10" fill="#fff" stroke="#1f3a5f" stroke-width="4"/>
  <g fill="#2a9d8f"><rect x="490" y="90" width="55" height="40" rx="3"/><rect x="560" y="90" width="80" height="25" rx="3"/><rect x="490" y="145" width="30" height="55" rx="3"/><rect x="535" y="160" width="105" height="40" rx="3"/></g>
  <g stroke="#e9b949" stroke-width="4" fill="none"><path d="M545 110 H 600 V 115"/><path d="M505 130 V 145"/><path d="M520 175 H 535"/></g>
  <!-- check -->
  <circle cx="565" cy="370" r="70" fill="#fff" stroke="#2a9d8f" stroke-width="6"/>
  <path d="M530 372 L556 398 L603 345" fill="none" stroke="#2a9d8f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- loop -->
  <g stroke="#1f3a5f" stroke-width="5" fill="none" marker-end="url(#a)">
    <path d="M285 200 C 340 140, 400 130, 460 140"/>
    <path d="M600 228 C 625 260, 625 280, 610 300"/>
    <path d="M490 385 C 400 400, 330 370, 280 310"/>
  </g>
</svg>
